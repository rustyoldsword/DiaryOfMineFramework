[Enslavement]
; 1 = notification when an enslavement starts and when the NPC has become a slave (with the time it took)
Notify=1
; 1 = never stop an enslavement to ask "read this NPC's personality from its file?" (DoM's own "don't ask again";
; whether the file is read still follows DoM)
SkipPersonalityFilePrompt=1
; seconds after a capture starts until the player's movement (held for the capture animation) is given back; 0 = at once.
; It is also given back when the enslavement ends, whatever happens to Diary of Mine's script.
ReleaseMovementAfter=3.5

[Untie]
; Diary of Mine leaves the gag, cuffs and blindfold on after "untie" (its MCM toggles, off by default and not kept
; between games). 1 = take them off on untie; Diary of Mine's toggles are set once on every NEW game (a loaded save keeps
; what its MCM says). 0 = leave Diary of Mine's own setting.
RemoveGag=1
RemoveCuffs=1
RemoveBlindfold=1

[Panel]
; 1 = the slave panel opens beside the dialogue with one of your Diary of Mine slaves
Enabled=1
; size of the panel, 0.6 to 2.0
Scale=1.0
; 1 = while the panel is open, the game's dialogue window and cursor are hidden (only the panel is shown)
HideDialogue=1
; key that folds the panel to one line (the game's own dialogue and cursor) and unfolds it; DirectInput scan code in decimal, 62 = F4
ToggleKey=62
; 0 = the world goes on while the panel is open (SKSE Menu Framework's time freeze is lifted; cursor and clicks as always)
; 1 = keep SKSE Menu Framework's time freeze (its FreezeTimeOnMenu)
PauseGame=0

[Knockout]
; 1 = E on an actor knocked out by Knockout Extensions opens one menu: Enslave, Tie up, Put in a sack, Hire, Search,
; Wake up, Finish off, Leave (keys 1-8, Esc closes). Diary of Mine's choices wake the actor fully first.
Menu=1

[Generator]
; personality of a new slave (DOM_Generator): 1 = native (fast), 0 = Diary of Mine's original Papyrus,
; 2 = native, then the original after it and both results compared in DiaryOfMineFramework.log (slower; for checking)
Mode=1

[Debug]
; 1 = sample every Diary of Mine enslavement stack (every SampleMs while one runs) and write where the time goes to
; Documents\My Games\Skyrim Special Edition\SKSE\DiaryOfMineFramework.log. 0 = only the start/end lines (default)
ProfileEnslavement=0
SampleMs=5
ReportLines=30

[SceneGuard]
; The shared interlock with BaboDialogue (needs the mod "BaboDialogue - Patches", which carries the global
; _SG_SceneBusy and the conditions on Babo's Story Manager nodes). Without that plugin everything here is a no-op.
; 1 = while a Diary of Mine enslavement runs, set bit 1 of _SG_SceneBusy, so no new BaboDialogue event, kidnapping,
; bad end or ambient scene starts until it is over (what already runs is never interrupted)
Enabled=1
; seconds after which the bit releases itself if an enslavement never reports finishing (0 = never; the bit is also
; cleared on every load and new game, so it can never carry over into a save)
Timeout=180
; 1 = refuse the knocked-out menu's Enslave / Tie up / Put in a sack while BaboDialogue owns the player
; (its kidnapping, bad end or riekling capture is running, or the player is tied up by it)
RespectBabo=1
; 1 = while an enslavement runs, set BaboDialogue's own chatter knobs to 0 (monologues, guard/citizen/merchant/
; follower/bandit lines, the city NPC lines) and put them back afterwards. The values are saved to
; SKSE\Plugins\DiaryOfMineFramework\BaboQuiet.json as well, so a crash mid-capture cannot leave Babo mute.
QuietBaboDialogue=1
